{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: "DejaVuSans";
            src: url("{% static 'fonts/DejaVuSans.ttf' %}") format("truetype");
        }
        body {
            font-family: "DejaVuSans", sans-serif;
            font-size: 12px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #444;
            padding: 6px;
            text-align: center;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2>{{ title }}</h2>
    <p><strong>Дата отчёта:</strong> {{ date }}</p>
    <table>
        <thead>
            <tr>
                <th>Дата</th>
                <th>Номер</th>
                <th>Кол-во броней</th>
                <th>Доход (₽)</th>
            </tr>
        </thead>
        <tbody>
            {% for room in data %}
            <tr>
                <td>{{ date }}</td>
                <td>{{ room.name }}</td>
                <td>{{ room.count }}</td>
                <td>{{ room.total }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
