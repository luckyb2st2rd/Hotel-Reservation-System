{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">🔐 Подтверждение входа</h3>

    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="code" class="form-label">Код подтверждения:</label>
        <input type="text" name="code" id="code" class="form-control" required placeholder="Введите код из письма">
      </div>
      <button type="submit" class="btn btn-primary w-100">✅ Подтвердить</button>
    </form>
  </div>
</div>
{% endblock %}
